spring.application.name=kamaky-products
server.port=80

#Formato de fecha y hora en la consola
logging.pattern.dateformat=dd-MM HH:mm:ss

#Sin cache de plantillas mientras se desarrolla
spring.thymeleaf.cache=false

#Conexion a la base de datos local (se crea con sql/kamaky.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/kamaky
spring.datasource.username=usuario_kamaky
spring.datasource.password=Kamaky_2026.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Sentencias SQL y sus parametros en la consola
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

