<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{plantilla/fragmentos :: head}"></head>

    <body class="bg-light">

        <header th:replace="~{plantilla/fragmentos :: encabezado}"></header>

        <section th:replace="~{plantilla/fragmentos :: mensajes}"></section>

        <main>
            <div class="container pt-5 pb-5">

                <h1 class="fw-bold text-danger-emphasis">
                    Contáctanos
                </h1>

                <p class="text-muted">
                    Estamos para ayudarte. Podés comunicarte con nosotros
                    por cualquiera de nuestros medios de contacto.
                </p>

                <div class="card shadow-sm mt-4">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-3"
                            th:text="${informacionNegocio.nombre}">
                            Kamaky Products
                        </h4>

                        <p th:if="${informacionNegocio.telefono != null}">
                            <strong>Teléfono:</strong>
                            <span th:text="${informacionNegocio.telefono}"></span>
                        </p>

                        <p th:if="${informacionNegocio.correo != null}">
                            <strong>Correo electrónico:</strong>
                            <span th:text="${informacionNegocio.correo}"></span>
                        </p>

                        <p th:if="${informacionNegocio.ubicacion != null}">
                            <strong>Ubicación:</strong>
                            <span th:text="${informacionNegocio.ubicacion}"></span>
                        </p>

                        <p th:if="${informacionNegocio.whatsapp != null}">
                            <strong>WhatsApp:</strong>
                            <span th:text="${informacionNegocio.whatsapp}"></span>
                        </p>

                        <p th:if="${informacionNegocio.instagram != null}">
                            <strong>Instagram:</strong>
                            <span th:text="${informacionNegocio.instagram}"></span>
                        </p>

                        <p th:if="${informacionNegocio.facebook != null}">
                            <strong>Facebook:</strong>
                            <span th:text="${informacionNegocio.facebook}"></span>
                        </p>

                    </div>
                </div>

            </div>
        </main>

        <footer th:replace="~{plantilla/fragmentos :: pie}"></footer>

    </body>
</html>
