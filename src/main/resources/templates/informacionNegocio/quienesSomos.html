<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{plantilla/fragmentos :: head}"></head>

    <body class="bg-light">

        <header th:replace="~{plantilla/fragmentos :: encabezado}"></header>

        <section th:replace="~{plantilla/fragmentos :: mensajes}"></section>

        <main>
            <div class="container pt-5 pb-5">

                <h1 class="fw-bold text-danger-emphasis">
                    ¿Quiénes somos?
                </h1>

                <div class="card shadow-sm mt-4">
                    <div class="card-body p-4">

                        <h3 class="fw-bold"
                            th:text="${informacionNegocio.nombre}">
                            Kamaky Products
                        </h3>

                        <p class="text-muted mt-3"
                           th:text="${informacionNegocio.descripcion}">
                            Somos un emprendimiento dedicado a la elaboración
                            de productos de repostería artesanal.
                        </p>

                    </div>
                </div>

            </div>
        </main>

        <footer th:replace="~{plantilla/fragmentos :: pie}"></footer>

    </body>
</html>
